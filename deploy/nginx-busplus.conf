# nginx site for BusPlus. Installed by deploy/setup_server.sh
# (YOUR_DOMAIN is replaced with your domain). certbot then adds HTTPS to it.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    client_max_body_size 2m;           # matches MAX_CONTENT_LENGTH in config.py
    server_tokens off;                 # don't advertise the nginx version

    # Static files straight from disk. Links carry ?v=<version>, so they can be cached long.
    location /static/ {
        alias /opt/busplus/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Live bus stream (Server-Sent Events): push every update immediately.
    location = /api/buses/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Everything else goes to the app (gunicorn).
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
