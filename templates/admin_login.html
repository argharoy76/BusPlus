<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusPlus Backend - Admin Sign In</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/inter/inter.css') }}">
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 28px 24px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
        .badge {
            width: 42px; height: 42px; border-radius: 12px;
            background: linear-gradient(135deg, #0866ff, #0052cc);
            color: #fff; display: flex; align-items: center; justify-content: center;
        }
        .badge svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        h1 { margin: 0; font-size: 1.15rem; font-weight: 800; }
        .sub { margin: 2px 0 0; font-size: 0.8rem; color: #64748b; }
        label { display: block; font-size: 0.78rem; font-weight: 700; margin: 0 0 6px; color: #334155; }
        input {
            width: 100%; height: 44px; padding: 0 12px; margin-bottom: 14px;
            border: 1.5px solid #cbd5e1; border-radius: 10px; font: inherit; font-size: 0.95rem; outline: none;
        }
        input:focus { border-color: #0866ff; box-shadow: 0 0 0 3px rgba(8, 102, 255, 0.12); }
        button {
            width: 100%; height: 46px; border: none; border-radius: 10px; margin-top: 4px;
            background: #0866ff; color: #fff; font: inherit; font-weight: 800; font-size: 0.95rem; cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: default; }
        .error {
            display: none; margin-bottom: 14px; padding: 10px 12px; border-radius: 10px;
            background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; font-size: 0.84rem; font-weight: 600;
        }
    </style>
</head>
<body>
    <form class="card" id="admin-login-form" autocomplete="on">
        <div class="brand">
            <div class="badge">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="14.5" rx="3"/><path d="M5 10.5h14"/><path d="M9.5 6.5h5"/><path d="M7.5 17.5v2.5M16.5 17.5v2.5"/></svg>
            </div>
            <div>
                <h1>BusPlus Backend</h1>
                <p class="sub">Admin only</p>
            </div>
        </div>

        <div class="error" id="login-error" role="alert"></div>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <button type="submit" id="login-btn">Sign in</button>
    </form>

    <script>
        const form = document.getElementById("admin-login-form");
        const errorBox = document.getElementById("login-error");
        const btn = document.getElementById("login-btn");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorBox.style.display = "none";
            btn.disabled = true;
            try {
                const resp = await fetch("/api/auth/admin/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: document.getElementById("username").value.trim(),
                        password: document.getElementById("password").value
                    })
                });
                const data = await resp.json();
                if (data.success) {
                    window.location.href = data.redirect_url || "/backend";
                    return;
                }
                errorBox.textContent = data.message || "Sign-in failed.";
            } catch (err) {
                errorBox.textContent = "Connection error. Please try again.";
            }
            errorBox.style.display = "block";
            btn.disabled = false;
        });
    </script>
</body>
</html>
