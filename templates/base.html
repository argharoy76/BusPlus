<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}{{ tab_title() }}{% endblock %}</title>
    {% include "_theme.html" %}

    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    {# Words for this page's JavaScript (content/words/); map pages fill in the js_words block. #}
    <script>window.WORDS = {% block js_words %}{}{% endblock %};</script>

    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/inter/inter.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <main class="app-main">
            {% block content %}{% endblock %}
        </main>
    </div>
    {% block extra_js %}{% endblock %}
</body>
</html>
